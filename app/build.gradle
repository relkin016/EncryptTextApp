apply plugin: 'com.android.application'

// Версия приложения (0.x.y). versionCode выводится из неё и всегда больше старых сборок (<= 5).
def appVersion = "0.2.0"
def (vMajor, vMinor, vPatch) = appVersion.tokenize('.').collect { it as int }

// Ключ подписи лежит в keystore/ (вне git). Без него release собирается неподписанным.
def keystoreProps = rootProject.file('keystore/keystore.properties')

android {
    namespace 'dk.meznik.jan.encrypttext'
    compileSdk 35

    defaultConfig {
        applicationId "dk.meznik.jan.encrypttext"
        minSdk 23
        targetSdk 35
        versionCode 100 + vMajor * 10000 + vMinor * 100 + vPatch
        versionName appVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resourceConfigurations += ['en', 'ru']
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        if (keystoreProps.exists()) {
            def props = new Properties()
            keystoreProps.withInputStream { props.load(it) }
            release {
                storeFile rootProject.file("keystore/${props.storeFile}")
                storePassword props.storePassword
                keyAlias props.keyAlias
                keyPassword props.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs { excludes += ['lib/x86/**', 'lib/x86_64/**'] }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
